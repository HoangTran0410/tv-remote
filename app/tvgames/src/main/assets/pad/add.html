<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>TV Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0d12;color:#e8ebf3;font:16px system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px 30px}
h1{font-size:22px;margin:6px 0 4px}p{color:#9aa3b8;margin:4px 0 18px;line-height:1.45}
.pick{display:block;text-align:center;padding:18px;border-radius:14px;background:#3b82f6;color:#fff;font-weight:700;font-size:18px}
input[type=file]{display:none}
.f{background:#151a25;border-radius:12px;padding:12px 14px;margin-top:10px}
.n{display:flex;justify-content:space-between;gap:10px;font-size:14px;word-break:break-all}.n span:last-child{white-space:nowrap;color:#9aa3b8}
.bar{height:8px;border-radius:99px;background:#2a3042;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#3b82f6;transition:width .1s}
.ok .bar i{background:#22c55e}.bad .bar i{background:#ef4444}
input[type=text],input[type=url],#wn{width:100%;height:50px;border-radius:12px;border:2px solid #39404f;background:#151a25;color:#fff;font:16px system-ui;padding:0 14px;margin-bottom:10px}
#wmsg{margin-top:12px;font-size:14px}
a{color:#7aa7ff;display:inline-block;margin-top:20px}
</style>
</head>
<body>
<h1 id="h"></h1><p id="p"></p>
<label class="pick" id="pick"></label><input id="file" type="file" multiple accept=".nes,.sfc,.smc,.gba,.cue,.chd,.pbp,.zip">
<div id="list"></div>
<h1 id="h2" style="margin-top:34px"></h1><p id="p2"></p>
<form id="wf"><input id="wn" maxlength="40" autocomplete="off"><input id="wu" type="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://"><button class="pick" id="wb" type="submit" style="border:0;width:100%"></button></form>
<div id="wmsg"></div>
<a id="back"></a>
<script>
const K = new URLSearchParams(location.search).get('k') || '';
const VI = (navigator.language || '').toLowerCase().startsWith('vi');
const W = VI ? { h: 'Thêm game', p: 'Chọn file game (.nes, tối đa 64 MB mỗi file). Game hiện trên TV ngay sau khi tải xong.', b: 'Chọn file…', ok: 'Xong', bad: 'Lỗi', big: 'Quá 64 MB', typ: 'Loại file không hỗ trợ', back: '← Về tay cầm', h2: 'Thêm link game web', p2: 'Dán địa chỉ một game chạy trên trình duyệt (https, hoặc http trong mạng nhà). Chơi bằng tay cầm này.', wn: 'Tên game', wb: 'Thêm link', wok: 'Đã thêm. Xem trên TV.', wbad: 'Link không hợp lệ (cần http:// hoặc https://)' }
  : { h: 'Add games', p: 'Pick game files (.nes, up to 64 MB each). They show up on the TV as soon as they are uploaded.', b: 'Choose files…', ok: 'Done', bad: 'Failed', big: 'Over 64 MB', typ: 'Unsupported file type', back: '← Back to the controller', h2: 'Add a web game link', p2: 'Paste the address of a game that runs in a browser (https, or http on your home network). You play it with this controller.', wn: 'Game name', wb: 'Add link', wok: 'Added. Look at the TV.', wbad: 'Not a valid link (needs http:// or https://)' };
document.documentElement.lang = VI ? 'vi' : 'en';
h.textContent = W.h; p.textContent = W.p; pick.textContent = W.b; pick.htmlFor = 'file';
back.textContent = W.back; back.href = '/?k=' + encodeURIComponent(K);
h2.textContent = W.h2; p2.textContent = W.p2; wn.placeholder = W.wn; wb.textContent = W.wb; wn.type = 'text';
wf.onsubmit = (e) => {
  e.preventDefault();
  const x = new XMLHttpRequest();
  x.open('POST', '/weblink?k=' + encodeURIComponent(K) + '&name=' + encodeURIComponent(wn.value.trim()) + '&url=' + encodeURIComponent(wu.value.trim()));
  x.onload = () => { wmsg.textContent = x.status === 200 ? W.wok : W.wbad; wmsg.style.color = x.status === 200 ? '#22c55e' : '#ef4444'; if (x.status === 200) { wn.value = ''; wu.value = ''; } };
  x.onerror = () => { wmsg.textContent = W.bad; wmsg.style.color = '#ef4444'; };
  x.send();
};
const OK = /\.(nes|sfc|smc|gba|cue|chd|pbp)$/i;
file.onchange = () => { [...file.files].forEach(up); file.value = ''; };
function up(f) {
  const row = document.createElement('div'); row.className = 'f';
  row.innerHTML = '<div class="n"><span></span><span>0%</span></div><div class="bar"><i></i></div>';
  row.querySelector('span').textContent = f.name; list.prepend(row);
  const pct = row.querySelectorAll('span')[1], bar = row.querySelector('i');
  const fail = (m) => { row.classList.add('bad'); pct.textContent = m; bar.style.width = '100%'; };
  if (f.size > 64 * 1024 * 1024) return fail(W.big);
  if (!OK.test(f.name)) return fail(W.typ);
  const x = new XMLHttpRequest();
  x.open('POST', '/upload?k=' + encodeURIComponent(K) + '&name=' + encodeURIComponent(f.name));
  x.upload.onprogress = (e) => { if (e.lengthComputable) { const v = Math.round(e.loaded / e.total * 100); pct.textContent = v + '%'; bar.style.width = v + '%'; } };
  x.onload = () => { if (x.status === 200) { row.classList.add('ok'); pct.textContent = W.ok; bar.style.width = '100%'; } else fail(W.bad + ' ' + x.status); };
  x.onerror = () => fail(W.bad);
  x.send(f);
}
</script>
</body>
</html>
