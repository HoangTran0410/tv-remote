<script>
  // the site's choice (docs/js/site.js keeps it in localStorage "lang"); the pages in the frames read the same key
  (function () {
    var l = 'vi';
    try { var m = /[?&]lang=(vi|en)/.exec(location.search); l = m ? m[1] : localStorage.getItem('lang') || (/^vi/i.test(navigator.language) ? 'vi' : 'en');
      if (l !== 'vi' && l !== 'en') l = 'vi'; localStorage.setItem('lang', l); } catch (e) {}
    document.documentElement.dataset.lang = l; document.documentElement.lang = l;
  })();
</script>
<style>
  :root { --bg:#0a0d14; --card:#141924; --line:#232a3a; --text:#e9edf5; --muted:#9aa4b8; --blue:#5b8cff; --fill:#2f5fd6; --sel:#162447;
    --card2:#1a2030; --line2:#2f3850; --orange:#ffa31a; --prog-a:var(--blue); --prog-b:var(--orange); --sheet-bg:#0e121b; --max:1160px; }   /* the rest are the header's (css/nav.css) */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  html[data-lang="vi"] .en, html[data-lang="en"] .vi { display: none !important; }
  button, a { font: inherit; color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  svg { width: 17px; height: 17px; flex: none; }
  #top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 7px 16px; min-height: 52px; }
  #demobar .dbtn { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; border-radius: 10px; padding: 6px 12px; min-height: 36px; border: 1px solid var(--line); background: transparent; font-weight: 600; cursor: pointer; white-space: nowrap; }
  #demobar .dbtn:hover { filter: brightness(1.25); }
  .sw { display: flex; gap: 4px; }
  .sw a { display: grid; place-items: center; width: 40px; height: 36px; border-radius: 10px; border: 1px solid transparent; }
  .sw a img { width: 26px; height: 26px; border-radius: 7px; display: block; }
  .sw a:hover { background: #0e121b; }
  .sw a[aria-current="page"] { background: var(--sel); border-color: var(--blue); }
  /* the site's name top left, as on every page of the site; it is the way home */
  #demobar .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; text-decoration: none; color: var(--text); white-space: nowrap; margin-right: 6px; }
  #demobar .brand img { width: 28px; height: 28px; border-radius: 8px; display: block; }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  #demobar .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #demobar .lang button { border: 0; background: transparent; padding: 6px 10px; min-height: 34px; color: var(--muted); font-weight: 600; cursor: pointer; }
  html[data-lang="vi"] #demobar .lang [data-l="vi"], html[data-lang="en"] #demobar .lang [data-l="en"] { background: var(--sel); color: var(--text); }
  #dl { background: var(--fill); border-color: var(--fill); color: #fff; }
  #stage { position: relative; }
  #stage iframe { display: block; width: 100%; border: 0; background: var(--bg); }
  #stage iframe[hidden] { display: none; }
  #stage.fill iframe { height: calc(100vh - var(--hh, 52px)); height: calc(100dvh - var(--hh, 52px)); min-height: 420px; }
  body.pick #stage, body.pick #top, body:not(.pick) > nav { display: none; }   /* the picker has the site header, an app the demo bar */
  body:not(.pick) #picker { display: none; }
  /* the picker: four big cards */
  #picker { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  #picker h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.2; }
  #picker .sub { margin: 0 0 22px; color: var(--muted); font-size: 16px; }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; text-decoration: none; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--blue); transform: translateY(-2px); }
  .card:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .card .shot { aspect-ratio: 2 / 1; background: #0e1320; display: block; width: 100%; object-fit: cover; object-position: top; }
  .card .shot { filter: grayscale(1) brightness(.6); transition: filter .2s; }   /* grey until pointed at: the app's name reads first */
  .card:hover .shot, .card:focus-visible .shot, .card:active .shot { filter: none; }
  @media (prefers-reduced-motion: reduce) { .card, .card .shot { transition: none; } }
  .card .shot.contain { object-fit: contain; object-position: center; padding: 10px 0; }
  .card .txt { display: grid; grid-template-columns: 64px 1fr; gap: 4px 16px; align-items: center; padding: 18px 20px 20px; }
  .card .txt img { width: 64px; height: 64px; border-radius: 15px; grid-row: 1 / 3; }
  .card .txt b { font-size: 26px; line-height: 1.15; }
  .card .txt span { color: var(--muted); font-size: 15px; }
  @media (max-width: 700px) { .cards { grid-template-columns: minmax(0, 1fr); gap: 14px; } #picker { padding: 18px 12px 32px; } #picker h1 { font-size: 24px; } .card .txt b { font-size: 22px; } .card .txt { padding: 14px 16px 16px; grid-template-columns: 56px 1fr; } .card .txt img { width: 56px; height: 56px; } }
  @media (max-width: 760px) { .bar { padding: 6px 12px; } #dl .t { display: none; } #demobar .brand { font-size: 0; gap: 0; margin-right: 0; } .bar .back span.l { display: inline; } }
</style>
<link rel="canonical" href="https://tvremote.pages.dev/demo/">
<meta property="og:type" content="website">
<meta property="og:title" content="Dùng thử TV Remote ngay trên trình duyệt / Try TV Remote in your browser">
<meta property="og:description" content="Dùng thử TV Remote, TV Home, TV Channels và TV Games ngay trên trình duyệt với một chiếc TV giả. Không cần cài gì.">

<body class="pick">
<script src="../js/nav.js" data-page="demo" data-root="../"></script>
<div id="top">
  <div class="bar" id="demobar">
    <a class="brand" href="../"><img src="../img/icon.png?v=1024" width="28" height="28" alt="">TV Remote</a>
    <a class="dbtn back" id="back" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6l-6 6 6 6"/></svg><span class="l"><span class="vi">Tất cả app</span><span class="en">All apps</span></span></a>
    <div class="sw" id="sw" role="navigation" aria-label="Apps"></div>
    <div class="tools">
      <span class="lang" role="group" aria-label="Language"><button type="button" data-l="vi">VI</button><button type="button" data-l="en">EN</button></span>
      <button type="button" class="dbtn" id="again" title="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="vi">Làm lại</span><span class="en">Reset</span></button>
      <a class="dbtn" id="dl" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg><span class="t" id="dlt"></span></a>
    </div>
  </div>
</div>
<main id="picker">
  <h1><span class="vi">Dùng thử trên trình duyệt</span><span class="en">Try it in your browser</span></h1>
  <p class="sub"><span class="vi">Chọn một app. Mọi thứ chạy trên một chiếc TV giả: không có gì được lưu hay gửi đi.</span><span class="en">Pick an app. Everything runs on a made-up TV: nothing is saved or sent.</span></p>
  <div class="cards" id="cards"></div>
</main>
<div id="stage"></div>
<script>
(function () {
  var REL = 'https://github.com/HoangTran0410/tv-remote/releases/latest/download/';
  // the four apps: name, one line, its real icon and a real screenshot (vi, en), where to get it, and how its page sits in the hub
  var TABS = {
    remote:   { n: 'TV Remote', vi: 'Điều khiển TV bằng điện thoại hoặc máy tính: phím, gõ chữ, mở app.', en: 'Control a TV from a phone or computer: keys, typing, apps.', dl: ['Tải app', 'Get the app'], href: '../#install', fill: true },
    home:     { n: 'TV Home', vi: 'Màn hình chính riêng cho TV: gọn, không quảng cáo, hình nền đẹp.', en: 'A clean home screen for the TV: no ads, nice wallpapers.', dl: ['Tải TV Home', 'Get TV Home'], href: REL + 'tv-home.apk' },
    channels: { n: 'TV Channels', vi: 'Kênh truyền hình miễn phí của iptv-org, xem ngay trên TV.', en: "iptv-org's free TV channels, right on the TV.", dl: ['Tải TV Channels', 'Get TV Channels'], href: REL + 'tv-channels.apk', drop: true },
    games:    { n: 'TV Games', vi: 'Game retro và game web trên TV, điện thoại làm tay cầm.', en: 'Retro and web games on the TV, phones as pads.', dl: ['Tải TV Games', 'Get TV Games'], href: REL + 'tv-games.apk' },
  };
  var IDS = Object.keys(TABS);
  var $ = function (s) { return document.querySelector(s); }, stage = $('#stage'), top = $('#top');
  var lang = function () { return document.documentElement.dataset.lang; };
  var cur = null, frames = {}, pushed = false;
  var q = new URLSearchParams(location.search);

  // the picker's cards and the switcher's icons
  $('#cards').innerHTML = IDS.map(function (t) {
    var a = TABS[t];
    return '<a class="card" href="#' + t + '" data-t="' + t + '"><img class="shot' + (a.contain ? ' contain' : '') + '" src="img/shot-' + t + '.jpg?v=1024" alt="" loading="lazy">' +
      '<span class="txt"><img src="img/icon-' + t + '.png" alt=""><b>' + a.n + '</b><span><span class="vi">' + a.vi + '</span><span class="en">' + a.en + '</span></span></span></a>';
  }).join('');
  $('#sw').innerHTML = IDS.map(function (t) { return '<a href="#' + t + '" data-t="' + t + '" title="' + TABS[t].n + '" aria-label="' + TABS[t].n + '"><img src="img/icon-' + t + '.png" alt=""></a>'; }).join('');

  function srcOf(t) {
    var u = t + '.html?embed=1&lang=' + lang();
    if (t === 'remote' && q.get('go')) u += '&go=' + encodeURIComponent(q.get('go'));
    return u;
  }
  function frame(t) {
    if (frames[t]) return frames[t];
    var f = document.createElement('iframe'); f.title = TABS[t].n; f.hidden = true; f.src = srcOf(t); f.allow = 'autoplay'; f.dataset.t = t;
    if (!TABS[t].fill) f.style.height = '720px';
    stage.append(f); return (frames[t] = f);
  }
  function drop(t) { if (frames[t]) { frames[t].remove(); delete frames[t]; } }
  function fitTop() { document.documentElement.style.setProperty('--hh', top.offsetHeight + 'px'); }

  function picker() {
    if (cur && frames[cur]) { if (TABS[cur].drop) drop(cur); else frames[cur].hidden = true; }   // a playing channel must stop when its page is left
    cur = null; document.body.classList.add('pick'); document.title = lang() === 'en' ? 'Try TV Remote in your browser · TV Remote' : 'Dùng thử TV Remote ngay trên trình duyệt · TV Remote';
    window.scrollTo(0, 0); fitTop();
  }
  function show(t) {
    var old = cur; cur = t; document.body.classList.remove('pick');
    if (old && old !== t) { if (TABS[old].drop) drop(old); else if (frames[old]) frames[old].hidden = true; }
    document.querySelectorAll('#sw [data-t]').forEach(function (a) { if (a.dataset.t === t) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var T = TABS[t], l = lang() === 'en' ? 'en' : 'vi';
    $('#dlt').textContent = T.dl[l === 'en' ? 1 : 0]; $('#dl').href = T.href; $('#dl').title = T.dl[l === 'en' ? 1 : 0];
    document.title = T.n + (l === 'en' ? ': live demo' : ': dùng thử') + ' · TV Remote';
    stage.classList.toggle('fill', !!T.fill); fitTop();
    var f = frame(t); f.hidden = false;
    try { f.contentWindow.focus(); } catch (e) {}
  }
  function route() { var t = location.hash.slice(1); if (TABS[t]) show(t); else picker(); }
  addEventListener('hashchange', function () { if (!location.hash.slice(1)) { route(); return; } if (!cur) pushed = true; route(); });
  // between apps no history entry is added: Back goes to the picker
  $('#sw').addEventListener('click', function (e) { var a = e.target.closest('[data-t]'); if (!a) return; e.preventDefault(); try { history.replaceState(null, '', location.pathname + location.search + '#' + a.dataset.t); } catch (x) {} route(); });
  $('#back').addEventListener('click', function (e) {
    e.preventDefault();
    if (pushed) { pushed = false; history.back(); return; }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (x) {} route();
  });

  $('#again').addEventListener('click', function () { var f = frames[cur]; if (f) { f.src = 'about:blank'; setTimeout(function () { f.src = srcOf(cur); }, 30); } });
  // two sets of buttons: the demo bar's (data-l) and the site header's (data-set, from js/nav.js, which marks the chosen one with aria-pressed)
  function pressed() { document.querySelectorAll('.lang [data-set]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.set === lang()); }); }
  pressed();
  document.querySelectorAll('.lang [data-l], .lang [data-set]').forEach(function (b) {
    b.addEventListener('click', function () {
      var l = b.dataset.l || b.dataset.set; if (l === lang()) return;
      try { localStorage.setItem('lang', l); } catch (e) {}
      // served as /demo/ or /en/demo/ (_worker.js): the other language is the other address, as on the other pages (js/nav.js)
      if (window.langURL) { try { localStorage.setItem('langPick', l); } catch (e) {} location.assign(langURL(l)); return; }
      document.documentElement.dataset.lang = l; document.documentElement.lang = l; pressed();
      Object.keys(frames).forEach(drop); route();
    });
  });

  // a child asks: a taller page (its height), or another app (OK on the TV Channels tile of TV Home)
  addEventListener('message', function (e) {
    var d = e.data; if (!d || typeof d !== 'object') return;
    if (d.demoTab && TABS[d.demoTab]) { try { history.replaceState(null, '', location.pathname + location.search + '#' + d.demoTab); } catch (x) {} show(d.demoTab); }
    else if (d.demoH && cur && !TABS[cur].fill && frames[cur] && e.source === frames[cur].contentWindow) frames[cur].style.height = Math.max(300, Math.ceil(d.demoH)) + 'px';
  });

  // the keys of the TV when the focus is on this page (an icon just clicked), not in the frame
  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok', ' ': 'ok', Escape: 'back', Backspace: 'back', Home: 'home', ContextMenu: 'menu', m: 'menu', M: 'menu', h: 'home' };
  function fwd(e, down) {
    if (!cur || TABS[cur].fill || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON' || t.tagName === 'A')) return;
    var k = KEYS[e.key], f = frames[cur]; if (!k || !f) return;
    e.preventDefault(); if (down && e.repeat) return;
    f.contentWindow.postMessage({ demoKey: k, down: down }, '*');
  }
  addEventListener('keydown', function (e) { fwd(e, true); });
  addEventListener('keyup', function (e) { fwd(e, false); });
  addEventListener('resize', fitTop);

  if (q.get('go') && !TABS[location.hash.slice(1)]) { try { history.replaceState(null, '', location.pathname + location.search + '#remote'); } catch (e) {} }
  route();
})();
</script>
</body>
